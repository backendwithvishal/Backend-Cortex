name: Cortex AI Backend CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Syntax Verification
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/gateway/package-lock.json'

      - name: Install Gateway Dependencies
        run: |
          cd backend/gateway
          npm ci

      - name: Run Gateway Syntax Checks & Jest Tests
        env:
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          INTERNAL_API_KEY: test-internal-secret
        run: |
          cd backend/gateway
          npm test

      - name: Syntax Check All Microservice Entrypoints
        run: |
          node --check backend/gateway/index.js
          node --check backend/services/agent/index.js
          node --check backend/services/auth/index.js
          node --check backend/services/billing/index.js
          node --check backend/services/chat/index.js

  docker-build:
    name: Validate Docker Containers Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/gateway
          file: ./backend/gateway/Dockerfile
          push: false
          tags: cortex/gateway:latest

      - name: Build Auth Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/auth
          file: ./backend/services/auth/Dockerfile
          push: false
          tags: cortex/auth-service:latest
