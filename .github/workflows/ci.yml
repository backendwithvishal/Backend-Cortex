name: Cortex AI Backend CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-audit:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Run ESLint
        run: |
          cd backend
          npm run lint

      - name: Security Audit (Gateway)
        run: cd backend/gateway && npm audit --audit-level=high || true

      - name: Security Audit (Auth)
        run: cd backend/services/auth && npm audit --audit-level=high || true

      - name: Security Audit (Chat)
        run: cd backend/services/chat && npm audit --audit-level=high || true

      - name: Security Audit (Agent)
        run: cd backend/services/agent && npm audit --audit-level=high || true

      - name: Security Audit (Billing)
        run: cd backend/services/billing && npm audit --audit-level=high || true

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run Unit Tests & Syntax Verification
    runs-on: ubuntu-latest
    needs: lint-and-audit

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Test Gateway
        env:
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          INTERNAL_API_KEY: test-internal-secret
        run: |
          cd backend/gateway
          npm ci || npm install
          npm test

      - name: Install & Test Auth
        env:
          NODE_ENV: test
          INTERNAL_API_KEY: test-internal-secret
        run: |
          cd backend/services/auth
          npm ci || npm install
          npm test

      - name: Install & Test Chat
        env:
          NODE_ENV: test
          INTERNAL_API_KEY: test-internal-secret
        run: |
          cd backend/services/chat
          npm ci || npm install
          npm test

      - name: Install & Test Agent
        env:
          NODE_ENV: test
          INTERNAL_API_KEY: test-internal-secret
        run: |
          cd backend/services/agent
          npm ci || npm install
          npm test

      - name: Install & Test Billing
        env:
          NODE_ENV: test
          INTERNAL_API_KEY: test-internal-secret
        run: |
          cd backend/services/billing
          npm ci || npm install
          npm test

      - name: Syntax Check All Microservice Entrypoints
        run: |
          node --check backend/gateway/index.js
          node --check backend/services/agent/index.js
          node --check backend/services/auth/index.js
          node --check backend/services/billing/index.js
          node --check backend/services/chat/index.js

  docker-build:
    name: Validate Docker Containers Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/gateway
          file: ./backend/gateway/Dockerfile
          push: false
          tags: cortex/gateway:latest

      - name: Build Auth Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/auth
          file: ./backend/services/auth/Dockerfile
          push: false
          tags: cortex/auth-service:latest

      - name: Build Chat Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/chat
          file: ./backend/services/chat/Dockerfile
          push: false
          tags: cortex/chat-service:latest

      - name: Build Agent Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/agent
          file: ./backend/services/agent/Dockerfile
          push: false
          tags: cortex/agent-service:latest

      - name: Build Billing Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/billing
          file: ./backend/services/billing/Dockerfile
          push: false
          tags: cortex/billing-service:latest
