name: Cortex AI Backend - CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  static-analysis:
    name: Static Analysis & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Gateway Dependencies
        run: |
          if [ -f backend/gateway/package.json ]; then
            npm ci --prefix backend/gateway
          fi

      - name: Verify Environment Formatting
        run: |
          echo "Verifying environment templates..."
          if [ ! -f backend/.env.example ] && [ ! -f .env.example ]; then
            echo "Error: .env.example template is missing!"
            exit 1
          fi

  dependency-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run npm audit (Gateway)
        run: |
          if [ -f backend/gateway/package.json ]; then
            npm audit --audit-level=high --prefix backend/gateway || echo "Audit scan found warnings"
          fi

  unit-testing:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm ci --prefix backend/gateway

      - name: Run Test Suite
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
          INTERNAL_API_KEY: test-key-123
        run: |
          npm test --prefix backend/gateway

  docker-validation:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f backend/docker-compose.yml config

      - name: Dry Run Build Services
        run: |
          docker compose -f backend/docker-compose.yml build
