name: cortex-ai

services:
  # ─── Infrastructure ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cortex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cortex-net

  # ─── Gateway ───────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: cortex-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE=http://auth:5001
      - CHAT_SERVICE=http://chat:5002
      - AGENT_SERVICE=http://agent:5003
      - BILLING_SERVICE=http://billing:5004
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-300}
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
      agent:
        condition: service_healthy
      billing:
        condition: service_healthy
    networks:
      - cortex-net

  # ─── Auth Service ──────────────────────────────────────────────────────────
  auth:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    container_name: cortex-auth
    restart: unless-stopped
    environment:
      - PORT=5001
      - NODE_ENV=${NODE_ENV:-production}
      - MONGODB_URL=${MONGODB_URL}
      - REDIS_URL=redis://redis:6379
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - cortex-net

  # ─── Chat Service ──────────────────────────────────────────────────────────
  chat:
    build:
      context: ..
      dockerfile: services/chat/Dockerfile
    container_name: cortex-chat
    restart: unless-stopped
    environment:
      - PORT=5002
      - NODE_ENV=${NODE_ENV:-production}
      - MONGODB_URL=${MONGODB_URL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - cortex-net

  # ─── Agent Service ─────────────────────────────────────────────────────────
  agent:
    build:
      context: ..
      dockerfile: services/agent/Dockerfile
    container_name: cortex-agent
    restart: unless-stopped
    environment:
      - PORT=5003
      - NODE_ENV=${NODE_ENV:-production}
      - MONGODB_URL=${MONGODB_URL}
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE=http://auth:5001
      - CHAT_SERVICE=http://chat:5002
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5003/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cortex-net

  # ─── Billing Service ───────────────────────────────────────────────────────
  billing:
    build:
      context: ..
      dockerfile: services/billing/Dockerfile
    container_name: cortex-billing
    restart: unless-stopped
    environment:
      - PORT=5004
      - NODE_ENV=${NODE_ENV:-production}
      - MONGODB_URL=${MONGODB_URL}
      - AUTH_SERVICE=http://auth:5001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5004/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - cortex-net

networks:
  cortex-net:
    driver: bridge
